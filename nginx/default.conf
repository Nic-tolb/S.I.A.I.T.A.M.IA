# The frontend only talks to Spring Boot (business rule):
# nginx serves static files and proxies /api to the backend. n8n, Qdrant and OpenRouter are not exposed here.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # RAG queries can take a while (embeddings + generation)
        proxy_read_timeout 90s;
    }
}
